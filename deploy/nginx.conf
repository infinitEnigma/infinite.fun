server {
    listen 80;
    server_name infinite.fun www.infinite.fun;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name infinite.fun www.infinite.fun;

    # --- TLS (fill in your cert paths) ---
    ssl_certificate     /etc/ssl/certs/infinite.fun.crt;
    ssl_certificate_key /etc/ssl/private/infinite.fun.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # --- Static frontend (dist/) ---
    root /var/www/infinite.fun;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Coin images ---
    location /images/ {
        alias /var/www/infinite.fun/images/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # --- Express API ---
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 4M;
    }

    # --- Gzip ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}
